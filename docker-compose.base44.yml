services:
  web:
    image: node:22
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      # Bare (no value) so the platform's own values pass straight through.
      # __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS is appended to Vite's allowedHosts;
      # BASE44_SANDBOX_HOST_DOMAIN is used by vite.config.js to allow the sandbox
      # host wildcard while BASE44_PREVIEW_MODE === '1'.
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - BASE44_PREVIEW_MODE
      - BASE44_SANDBOX_HOST_DOMAIN
    command: ["sh", "-ec", "npm install && exec npx vite --host 0.0.0.0 --port 3000"]
    restart: on-failure
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>{if(!r.ok)throw new Error('bad status')}).catch(e=>{console.error(e.message);process.exit(1)})"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  node_modules:
